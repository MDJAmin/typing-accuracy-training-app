<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="css/style.css">
    <title>تایپ مستر | چالش تایپ حرفه‌ای</title>
  </head>
  <body>
    <div class="typing-card">
      <div class="header">
        <div class="score-area">
          <span class="score-label">🏆 امتیاز کل</span>
          <span
            class="score-value"
            id="totalScoreDisplay"
            >0</span
          >
          <button
            class="reset-score"
            id="resetScoreBtn"
          >
            ⟳ ریست امتیاز
          </button>
        </div>
        <div class="challenge-badge">🎯 چالش تصادفی | تایپ انگلیسی</div>
      </div>

      <div class="challenge-container">
        <div
          class="challenge-text"
          id="challengeText"
        >
        </div>
      </div>

      <div class="input-area">
        <textarea
          class="type-input"
          id="userInput"
          rows="2"
          placeholder="متن بالا را دقیقاً تایپ کنید... از تمام کلیدها (Space, @, !, ?, ...) استفاده کنید!"
        ></textarea>
      </div>

      <div class="status-bar">
        <div
          class="message"
          id="statusMsg"
        >
          ✨ آماده‌ای؟ متن را تایپ کن و همسان سازی کن ✨
        </div>
        <button
          class="next-btn"
          id="nextChallengeBtn"
        >
          ➡ چالش جدید ➡
        </button>
      </div>
      <div class="key-hint">
        ⌨️ پشتیبانی از تمام کلیدهای کیبورد: حروف، اعداد، @ # $ % ^ & * ( ) _ + ! ؟ (؟ معادل ?)
        , . ; : ' " / \ | space, enter , tab و ...
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
