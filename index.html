<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="css/style.css"
    />
    <title>تایپ حرفه‌ای | چالش زنده شبیه Keybr</title>
  </head>
  <body>
    <div class="typing-master">
      <div class="top-bar">
        <div class="score-panel">
          <span class="score-label">⚡ امتیاز کل</span>
          <span
            class="score-value"
            id="globalScoreSpan"
            >0</span
          >
          <button
            class="reset-score"
            id="resetGlobalBtn"
          >
            ⟳ ریست
          </button>
        </div>
        <div class="badge">🎯 چالش تصادفی | حالت Keybr-like</div>
      </div>

      <div class="challenge-arena">
        <div
          class="phrase-container"
          id="phraseClickZone"
        >
          <div
            class="static-challenge"
            id="challengeRenderZone"
          ></div>
        </div>
      </div>
      <div class="input-overlay">
        <input
          type="text"
          id="ghostInput"
          class="hidden-input"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <div class="input-simulator">
          <div class="typing-hint">
            ⌨️ هم اکنون تایپ کنید ... (همه کلیدها: @ # $ % ^ & * ! ؟ space)
          </div>
          <button
            class="next-btn"
            id="nextChallengeBtn"
          >
            ➡ چالش جدید ➡
          </button>
        </div>
      </div>

      <div class="status-area">
        <div id="liveMessage">
          ✨ هر کاراکتر را دقیق تایپ کن &nbsp;|&nbsp; سبز=صحیح &nbsp; قرمز=خطا
        </div>
        <div id="progressCounter"></div>
      </div>
      <div class="footer-keyboard">
        💡 سبک Keybr: کاراکتر جاری هایلایت آبی، کاراکترهای درست سبز، غلط قرمز. با اسپیس و علائم
        خاص مانند @ ! ؟ به راحتی تایپ کن!
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
